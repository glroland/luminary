apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: luminary
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/glroland/luminary.git
    targetRevision: main
    path: deploy/helm/luminary
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: luminary
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
