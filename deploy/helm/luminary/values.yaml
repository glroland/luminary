# Values shared across the api and web subcharts (charts/api, charts/web) --
# Helm passes everything under "global:" down into every subchart's own
# .Values.global automatically, which is how both charts agree on naming,
# the shared image registry/tag, and the api's port (the web subchart needs
# the latter to build its nginx proxy target) without referencing each
# other directly.
global:
  nameOverride: ""
  fullnameOverride: ""
  # Port the api container listens on and the api Service/Route expose --
  # shared because the web subchart's nginx proxy target needs it too.
  apiPort: 8080
  # Shared registry/org path and tag for both the api and web images --
  # the Jenkinsfile pushes both as "<repository>/luminary-api:$BUILD_NUMBER"
  # and "<repository>/luminary-web:$BUILD_NUMBER", so both components always
  # come from the same registry and build.
  image:
    repository: registry.home.glroland.com/luminary
    tag: "2"
  # Base64-encoded .dockerconfigjson for pulling the api/web images above --
  # same registry credential used by both, hence shared here rather than
  # duplicated per component. Note this value is plaintext-equivalent
  # (base64, not encrypted) once committed to source control -- consider
  # moving it to a values file kept out of git (--values on the CLI,
  # excluded via .gitignore) or managing this Secret out-of-band instead.
  imagePullSecretDockerConfigJson: ewogICJhdXRocyI6IHsKICAgICJyZWdpc3RyeS5ob21lLmdscm9sYW5kLmNvbSI6IHsKICAgICAgImF1dGgiOiAiYkhWdGFXNWhjbmtyYjJOd09qZEJRVGxRUjBWTFNVMUxOVWhYVWpBNFFVNUVXbGcwTWtzeE9USklVRVZCT0V0Rk9WTTJSVTFGUlZKUlJUbFVVVFpLTTBSU1dGWllRVUl3U1VKVVRUaz0iLAogICAgICAiZW1haWwiOiAiIgogICAgfQogIH0KfQ==

# Everything below is passed straight through to the matching subchart
# (charts/api, charts/web) as its own root values -- see each subchart's
# values.yaml for defaults/documentation of these fields.
api:
  image:
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 2000m
      memory: 2Gi
    limits:
      cpu: 8000m
      memory: 6Gi
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: ""
    accessMode: ReadWriteOnce
  env:
    corsOrigins: "*"
    photosUri: "smb://data.home.glroland.com/photo/2019 Spring Break in Boone"
    database:
      host: db.home.glroland.com
      port: 5432
      # The database name itself comes from databaseCredentialsSecret's
      # "database" key below, not a plain value here -- see that key's
      # comment.
    # Created by deploy/create-secrets.sh. Keys: database, username,
    # password -- keep all three in sync with that script's prompts.
    databaseCredentialsSecret: luminary-db-credentials
    # Created by deploy/create-secrets.sh -- keep this name in sync
    # with that script's PHOTOS_SECRET_NAME.
    photosCredentialsSecret: luminary-photos-credentials
    openaiBaseUrl: "https://maas.apps.ocp.home.glroland.com/sandbox/gemma-4/v1"
    openaiModel: "gemma-4"
    # Created by deploy/create-secrets.sh -- keep this name in sync
    # with that script's OPENAI_SECRET_NAME.
    openaiApiKeySecret: luminary-openai-credentials
    openaiStreaming: false
    florenceModel: microsoft/Florence-2-base
    florenceDevice: cpu
  route:
    enabled: true
    host: ""

web:
  image:
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  route:
    enabled: true
    host: ""
