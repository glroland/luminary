nameOverride: ""
fullnameOverride: ""

api:
  image:
    repository: quay.io/yourorg/luminary-api
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: ""
    accessMode: ReadWriteOnce
  env:
    corsOrigins: "*"
    # fsspec URI for photo storage: a bare path or file:// uses the PVC
    # below; s3://, smb://, https://, etc. point at an external backend
    # instead (set api.persistence.enabled=false in that case).
    photosUri: /data/photos
    # Name of a Secret (same namespace, keys `username`/`password`) used to
    # authenticate to photosUri -- e.g. an smb:// share. Leave empty if the
    # backend needs no credentials (local/NFS, or S3 via IAM role). Never
    # put credentials directly in photosUri or in this values file.
    photosCredentialsSecret: ""
  route:
    enabled: true
    host: ""

web:
  image:
    repository: quay.io/yourorg/luminary-web
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  route:
    enabled: true
    host: ""
