apiVersion: v1
kind: Service
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: {{ include "api.appName" . }}
    app.kubernetes.io/component: api
  ports:
    - port: {{ .Values.global.apiPort }}
      targetPort: {{ .Values.global.apiPort }}
