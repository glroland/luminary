apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "api.appName" . }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "api.appName" . }}
        app.kubernetes.io/component: api
    spec:
      imagePullSecrets:
        - name: {{ include "api.pullSecretName" . }}
      containers:
        - name: api
          image: "{{ .Values.global.image.repository }}/luminary-api:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.global.apiPort }}
          env:
            - name: LUMINARY_PHOTOS_URI
              value: {{ .Values.env.photosUri | quote }}
            {{- if .Values.env.photosCredentialsSecret }}
            - name: LUMINARY_PHOTOS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.photosCredentialsSecret }}
                  key: username
            - name: LUMINARY_PHOTOS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.photosCredentialsSecret }}
                  key: password
            {{- end }}
            - name: LUMINARY_DATABASE_HOST
              value: {{ .Values.env.database.host | quote }}
            - name: LUMINARY_DATABASE_PORT
              value: {{ .Values.env.database.port | quote }}
            - name: LUMINARY_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.databaseCredentialsSecret }}
                  key: database
            - name: LUMINARY_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.databaseCredentialsSecret }}
                  key: username
            - name: LUMINARY_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.databaseCredentialsSecret }}
                  key: password
            - name: LUMINARY_CORS_ORIGINS
              value: {{ .Values.env.corsOrigins | quote }}
            {{- if .Values.env.openaiBaseUrl }}
            - name: LUMINARY_OPENAI_BASE_URL
              value: {{ .Values.env.openaiBaseUrl | quote }}
            {{- end }}
            {{- if .Values.env.openaiModel }}
            - name: LUMINARY_OPENAI_MODEL
              value: {{ .Values.env.openaiModel | quote }}
            {{- end }}
            {{- if .Values.env.openaiApiKeySecret }}
            - name: LUMINARY_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.openaiApiKeySecret }}
                  key: apiKey
            {{- end }}
            - name: LUMINARY_OPENAI_STREAMING
              value: {{ .Values.env.openaiStreaming | quote }}
            {{- if .Values.env.embeddingModel }}
            - name: LUMINARY_EMBEDDING_MODEL
              value: {{ .Values.env.embeddingModel | quote }}
            {{- end }}
            - name: LUMINARY_EMBEDDING_DEVICE
              value: {{ .Values.env.embeddingDevice | quote }}
            - name: LUMINARY_FLORENCE_MODEL
              value: {{ .Values.env.florenceModel | quote }}
            - name: LUMINARY_FLORENCE_DEVICE
              value: {{ .Values.env.florenceDevice | quote }}
            - name: LUMINARY_FACE_DETECTION_THRESHOLD
              value: {{ .Values.env.faceDetectionThreshold | quote }}
            - name: LUMINARY_FACE_MIN_SIZE
              value: {{ .Values.env.faceMinSize | quote }}
            - name: LUMINARY_MAX_CONCURRENCY
              value: {{ .Values.env.maxConcurrency | quote }}
            - name: PORT
              value: {{ .Values.global.apiPort | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Startup gets its own probe so liveness doesn't start counting
          # until the app is actually up: up to 30 x 10s = 5 minutes to
          # pass once, after which liveness/readiness take over. All three
          # use a 30s timeout because a sync running CPU face detection can
          # saturate the pod and slow /api/health well past the 1s default.
          startupProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.global.apiPort }}
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.global.apiPort }}
            periodSeconds: 30
            timeoutSeconds: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.global.apiPort }}
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 3
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "api.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
