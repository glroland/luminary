# Defaults for standalone installs of this subchart. When deployed as part
# of the luminary umbrella chart, the parent's values.yaml "api:" section
# overrides these, and "global:" (image repository/tag, api port, naming
# overrides) is shared with the web subchart -- see the parent chart's
# values.yaml.
global:
  nameOverride: ""
  fullnameOverride: ""
  apiPort: 8080
  image:
    repository: quay.io/yourorg
    tag: latest

image:
  pullPolicy: IfNotPresent
replicaCount: 1
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
persistence:
  enabled: true
  size: 5Gi
  storageClassName: ""
  accessMode: ReadWriteOnce
env:
  corsOrigins: "*"
  # fsspec URI for photo storage: a bare path or file:// uses the PVC
  # below; s3://, smb://, https://, etc. point at an external backend
  # instead (set persistence.enabled=false in that case).
  photosUri: /data/photos
  # --- Database: photo metadata + thumbnails -----------------------------
  # A remote Postgres server that already exists outside this chart/the
  # ArgoCD app it tracks -- this chart never stands up Postgres itself.
  # Provision the database/role on it with `make db`/`make db-recreate`
  # (see db/ and the README) before deploying.
  database:
    host: db.example.com
    port: 5432
  # Name of a Secret (same namespace, keys `database`/`username`/
  # `password`) holding the database name and credentials `make db`/`make
  # db-create` provisioned. Required -- unlike photosCredentialsSecret,
  # Postgres always needs something to authenticate with, and the database
  # name itself lives here too rather than as a plain value, since it's as
  # deployment-specific as the credentials are. Never put these directly in
  # this values file.
  databaseCredentialsSecret: luminary-db-credentials
  # Name of a Secret (same namespace, keys `username`/`password`) used to
  # authenticate to photosUri -- e.g. an smb:// share. Leave empty if the
  # backend needs no credentials (local/NFS, or S3 via IAM role). Never
  # put credentials directly in photosUri or in this values file.
  photosCredentialsSecret: ""
  # --- Photo chat: path 1, any OpenAI-*compatible* multimodal endpoint ---
  # Base URL of the endpoint -- never assumed to be api.openai.com; point
  # this at a self-hosted OpenAI-compatible server (vLLM, Ollama, LM
  # Studio, etc). Leave empty only if the endpoint genuinely *is*
  # api.openai.com (the openai SDK's own default).
  openaiBaseUrl: ""
  # Model name as that server calls it -- required, no default.
  openaiModel: ""
  # Name of a Secret (same namespace, key `apiKey`) holding the API key.
  # Leave empty if the endpoint needs no key. Never put the key directly
  # in this values file.
  openaiApiKeySecret: ""
  # Stream the reply back token-by-token instead of all at once. Off by
  # default; only applies to the openai backend (Florence-2 has no
  # streaming API to use regardless of this setting).
  openaiStreaming: false
  # --- Description embeddings for similarity search (embeddings.py) -----
  # Hugging Face model id for photos.description_embedding -- a local
  # model run in-process (sentence-transformers), unrelated to the openai
  # settings above (see embeddings.py's module docstring for why: a
  # self-hosted OpenAI-compatible endpoint may have no embeddings endpoint
  # at all, or an incompatible one). Empty here means "use the app's own
  # default" (BAAI/bge-large-en-v1.5); its weights must already be baked
  # into the api image at build time (api/Containerfile's
  # LUMINARY_EMBEDDING_MODEL build-arg) -- if you override this, rebuild
  # the image with a matching --build-arg too, or it'll fail to load.
  embeddingModel: ""
  # "cpu" or "cuda" (a GPU-scheduled node/runtime class is required for
  # "cuda"; not set up by this chart) -- same as florenceDevice below.
  embeddingDevice: cpu
  # --- Photo chat: path 2, local Florence-2 vision-language model -------
  # https://huggingface.co/microsoft/Florence-2-base . Runs in-process in
  # the api pod via torch/transformers -- substantially increases memory
  # use (bump resources above; budget several GiB for CPU inference, more
  # for -large) and cold-start time (weights are downloaded and loaded
  # into memory on first chat request, then cached).
  florenceModel: microsoft/Florence-2-base
  # "cpu" or "cuda" (a GPU-scheduled node/runtime class is required for
  # "cuda"; not set up by this chart).
  florenceDevice: cpu
  # --- Automatic face detection (sync.py's indexing pipeline) ------------
  # Confidence threshold facenet-pytorch's MTCNN must clear to report a
  # detected face -- lower catches more faces (partial/angled/small, or in
  # a crowded photo) at the cost of more false positives. No single
  # verified-correct value across different libraries' real photos; tune
  # against yours. See face_detection.py's module docstring.
  faceDetectionThreshold: "0.8"
  # Smallest face, in pixels of MTCNN's internally-resized copy of the
  # image (not the original photo's resolution), it will report -- lower
  # catches smaller/more distant faces at the cost of more false positives
  # and slower detection. facenet-pytorch's own MTCNN default (20) was
  # confirmed too permissive in practice (spurious small-box detections);
  # 150 is the current starting point. See config.get_face_min_size()'s
  # docstring.
  faceMinSize: "150"
  # How many files/photos sync.py's indexing (face detection included) and
  # recognition.py's "Refresh Faces" fan out across at once -- see
  # config.get_max_concurrency()'s docstring. 8 was the original hardcoded
  # value for both; kept as this chart's default since a k8s pod has
  # dedicated CPU for this, unlike a local `make run-api` (whose own
  # Makefile default is lower -- see LUMINARY_MAX_CONCURRENCY there).
  maxConcurrency: "8"
route:
  enabled: true
  host: ""
