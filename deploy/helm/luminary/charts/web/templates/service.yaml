apiVersion: v1
kind: Service
metadata:
  name: {{ include "web.fullname" . }}
  labels:
    {{- include "web.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: {{ include "web.appName" . }}
    app.kubernetes.io/component: web
  ports:
    - port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
