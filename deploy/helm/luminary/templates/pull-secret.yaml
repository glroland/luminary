apiVersion: v1
kind: Secret
metadata:
  name: {{ include "luminary.pullSecretName" . }}
  labels:
    {{- include "luminary.labels" . | nindent 4 }}
data:
  .dockerconfigjson: {{ .Values.global.imagePullSecretDockerConfigJson | required "global.imagePullSecretDockerConfigJson is required -- base64-encoded .dockerconfigjson for pulling api/web images" }}
type: kubernetes.io/dockerconfigjson
