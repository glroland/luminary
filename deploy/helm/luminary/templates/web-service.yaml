apiVersion: v1
kind: Service
metadata:
  name: {{ include "luminary.webFullname" . }}
  labels:
    {{- include "luminary.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: {{ include "luminary.name" . }}
    app.kubernetes.io/component: web
  ports:
    - port: {{ .Values.web.port }}
      targetPort: {{ .Values.web.port }}
