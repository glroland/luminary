<!-- The circle mark from the Luminary logo (components/Logo.jsx, without the
     wordmark). Colours switch with the browser's own light/dark scheme so
     the ring stays visible on a dark tab strip; keep in step with the
     logo tokens in styles.css. -->
<svg viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <style>
    .rays { stroke: #2f6fb8; }
    .ring { stroke: #163a6b; }
    .core { fill: #1d4e8c; }
    @media (prefers-color-scheme: dark) {
      .rays { stroke: #5b9be6; }
      .ring { stroke: #9cc3f5; }
      .core { fill: #3b82f6; }
    }
  </style>
  <g class="rays" stroke-width="4" stroke-linecap="round">
    <line x1="36" y1="2" x2="36" y2="10" />
    <line x1="36" y1="62" x2="36" y2="70" />
    <line x1="2" y1="36" x2="10" y2="36" />
    <line x1="62" y1="36" x2="70" y2="36" />
    <line x1="13" y1="13" x2="19" y2="19" />
    <line x1="53" y1="53" x2="59" y2="59" />
    <line x1="59" y1="13" x2="53" y2="19" />
    <line x1="19" y1="53" x2="13" y2="59" />
  </g>
  <circle class="ring" cx="36" cy="36" r="26" fill="none" stroke-width="5" />
  <circle class="core" cx="36" cy="36" r="18" />
  <circle cx="32" cy="31" r="6.5" fill="#bcdcf7" opacity="0.9" />
</svg>
